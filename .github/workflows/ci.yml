name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    # Linux + macOS mirrors the BCR presubmit platforms. "pinned" is
    # .bazelversion; 8.5.0 is the oldest supported Bazel (bazel_compatibility
    # in MODULE.bazel), since it is the first with extension facts. BCR
    # presubmit covers the latest 8.x. A job on another version than the
    # pinned one writes it into every .bazelversion (see the first step).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: [pinned, 8.5.0]
    name: build-and-test (${{ matrix.os }}, ${{ matrix.bazel }})
    runs-on: ${{ matrix.os }}
    env:
      # gazelle's go_repository then reads Go modules from the user's module
      # cache (restored below) instead of downloading each into a cache
      # private to the output base. The build fills it once; the integration
      # tests' nested Bazels, which set this too, find everything there and
      # never reach proxy.golang.org, whose timeouts have failed them.
      GO_REPOSITORY_USE_HOST_CACHE: "1"
    steps:
      - uses: actions/checkout@v7

      # Bazelisk takes the version from the nearest .bazelversion: the root's
      # for the build, each nested module's (e2e/smoke, the integration
      # tests' workspaces) for its own. The Bazel that the integration tests
      # run inside themselves is the root file's too (bazel_binaries.download
      # in MODULE.bazel), whatever runs the outer build: USE_BAZEL_VERSION
      # would never reach it (issue #88). So write this job's version into
      # every copy, and the whole job runs on it, nested Bazels included.
      - name: Use Bazel ${{ matrix.bazel }} everywhere
        if: matrix.bazel != 'pinned'
        run: |
          for f in $(git ls-files .bazelversion '*/.bazelversion'); do
            echo '${{ matrix.bazel }}' > "$f"
          done
          git status --short

      # Keyed on go.sum, so a run with unchanged Go modules downloads none.
      - name: Restore the Go module cache
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gomod-${{ runner.os }}-

      # cache-version is part of every cache key, so each Bazel version gets
      # its own bazelisk and repository caches. With shared keys, whichever
      # job finished first saved them, and the other version's dependencies
      # (Bazel itself, protobuf, rules_java, ...) were fetched from GitHub
      # releases on every run, failing whenever GitHub did.
      # Only pushes to main save caches: pull requests restore from them
      # (via the key prefix) without adding a set per commit, which kept the
      # repository at the Actions cache limit and evicted what main had saved.
      # A cache is saved only while its key is new, so the repository cache
      # is keyed on every file that decides what gets downloaded: the
      # nested workspaces' modules and the lockfile (module facts) as well as
      # the root MODULE.bazel, and the pinned tofu releases. With the default
      # key (MODULE.bazel alone) a dependency bump through the lockfile, or a
      # provider the integration tests fetch, was never saved.
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          cache-version: ${{ matrix.bazel }}
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - e2e/smoke/MODULE.bazel
            - tests/integration/*/MODULE.bazel
            - toolchain/versions.bzl

      # On the pinned version, a MODULE.bazel.lock that needs any update
      # (e.g. a provider digest not yet recorded as a fact) fails the build
      # rather than being rewritten. Other versions write the lockfile in
      # their own format, so they can't use it.
      - name: Build
        run: bazel build //... ${{ matrix.bazel == 'pinned' && '--lockfile_mode=error' || '' }}

      # lock_update_test and tf_modules_test pin against the live OpenTofu
      # registry, and have failed when it could not be reached for a minute.
      # A second attempt costs under a minute; Bazel reports such a test as
      # FLAKY, so a flake stays visible without failing the run.
      - name: Test
        run: bazel test //... --test_output=errors --verbose_failures --flaky_test_attempts=2 ${{ matrix.bazel == 'pinned' && '--lockfile_mode=error' || '' }}

      # The module examples call real modules from the OpenTofu registry and
      # GitHub. Building them only validates; planning runs them, offline,
      # against what rules_tofu fetched and the providers the lock pins.
      - name: Plan the module examples
        run: |
          for example in label stack git; do
            bazel run "//examples/modules/${example}:${example}.plan" ${{ matrix.bazel == 'pinned' && '--lockfile_mode=error' || '' }}
          done

      # e2e/smoke is the BCR presubmit test module and models the README-shaped
      # consumer path. It's excluded from //... via --deleted_packages, so build
      # it explicitly here to catch consumer-facing breakage before a release.
      - name: Build and test e2e/smoke consumer module
        run: |
          cd e2e/smoke
          bazel build //...
          bazel test //... --test_output=errors

      # MODULE.bazel.lock's format is specific to a Bazel version, so only the
      # pinned version can be expected to leave it untouched (and the other
      # jobs have rewritten the .bazelversion files).
      - name: Check for uncommitted changes
        if: matrix.bazel == 'pinned'
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::Uncommitted changes detected after build/test (e.g. MODULE.bazel.lock). Please run the failing commands locally and commit the updated files."
            echo "$changes"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nested Bazel modules (e2e/smoke and the tests/integration
      # sub-workspaces) each carry their own .bazelversion:
      # bazelisk resolves the version from the nearest MODULE.bazel boundary
      # and never sees the root pin. Keep every copy identical to the root
      # file. (The build-and-test jobs on another version rewrite them all,
      # in their own checkout.)
      - name: Check .bazelversion files are in sync
        run: |
          for f in $(git ls-files '*/.bazelversion'); do
            if ! cmp -- .bazelversion "$f"; then
              echo "::error::$f is out of sync with the root .bazelversion. Keep all copies identical to the root file."
              exit 1
            fi
          done

      # Go sources are formatted by gofmt, which buildifier does not cover.
      # The version comes from go.mod so there is one source of truth, even
      # though Bazel builds with the SDK pinned in MODULE.bazel.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Go files are not gofmt-clean. Run 'gofmt -w .' and commit:"
            echo "$unformatted"
            exit 1
          fi

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          disk-cache: ${{ github.workflow }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock

      - name: Run buildifier (format check)
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -r .

      - name: Run buildifier (lint warnings)
        run: bazel run @buildifier_prebuilt//:buildifier -- -lint=warn -r .

      # `bazel mod tidy` manages use_repo lines (rules_tofu's extensions report
      # their direct deps for it) and normalises MODULE.bazel; it must have nothing
      # to change. Only MODULE.bazel is checked: the command may also refresh
      # MODULE.bazel.lock, which the build jobs check.
      - name: Check bazel mod tidy leaves MODULE.bazel unchanged
        run: |
          bazel mod tidy
          if ! git diff --exit-code -- MODULE.bazel; then
            echo "::error::'bazel mod tidy' changes MODULE.bazel. Run it and commit the result."
            exit 1
          fi
